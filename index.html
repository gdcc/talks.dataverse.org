<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dataverse Talks</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #656d76; --line: #d8dee4;
    --link: #0969da; --chip: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d;
      --link: #4493f8; --chip: #161b22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  .intro { margin: 0 0 20px; color: var(--muted); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  input[type=search] {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--fg);
    background: var(--chip); border: 1px solid var(--line); border-radius: 8px;
  }
  .count { margin: 8px 0 24px; color: var(--muted); font-size: 0.9rem; }
  h2 {
    margin: 32px 0 0; padding-bottom: 4px; font-size: 1.2rem;
    border-bottom: 1px solid var(--line);
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: grid; grid-template-columns: 6.5em 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .date { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 0.9rem; }
  .tag {
    display: inline-block; margin-left: 6px; padding: 0 6px; font-size: 0.75rem;
    border: 1px solid var(--line); border-radius: 10px; background: var(--chip);
    vertical-align: middle; font-weight: normal; color: var(--muted);
  }
  nav { display: flex; gap: 4px; margin: 0 0 16px; border-bottom: 1px solid var(--line); }
  nav a {
    padding: 6px 12px; color: var(--muted); border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav a:hover { text-decoration: none; color: var(--fg); }
  nav a[aria-current] { color: var(--fg); border-bottom-color: var(--link); font-weight: 600; }
  .meta a { color: inherit; }
  .meta a:hover { color: var(--link); }
  .filter { margin: 0 0 8px; }
  .filter strong { font-size: 1.2rem; }
  li.speaker { grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; }
  .who { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
  .who > .handle, .who > .years { margin-left: 0; }
  .n { font-variant-numeric: tabular-nums; font-weight: 600; }
  .years { color: var(--muted); font-size: 0.9rem; margin-left: 8px; white-space: nowrap; }
  .handle { margin-left: 8px; font-size: 0.9rem; white-space: nowrap; }
  .n { white-space: nowrap; }
  @media (max-width: 520px) {
    li { grid-template-columns: 1fr; gap: 2px; }
    li.speaker { grid-template-columns: minmax(0, 1fr) auto; }
  }
</style>
</head>
<body>
<main>
  <h1>Dataverse Talks</h1>
  <p class="intro">Talks about <a href="https://dataverse.org">Dataverse</a>, newest first. Recordings are on <a href="https://github.com/IQSS/dataverse-tv">DataverseTV</a>. Missing a talk? <a href="https://github.com/gdcc/talks.dataverse.org">Let us know</a>.</p>
  <nav>
    <a href="#/" id="nav-talks">Talks</a>
    <a href="#/speakers" id="nav-speakers">Speakers</a>
  </nav>
  <div id="filter" class="filter" hidden></div>
  <input type="search" id="q" aria-label="Search">
  <p class="count" id="count">Loading…</p>
  <div id="list"></div>
</main>
<script>
  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const filter = document.getElementById("filter");
  const q = document.getElementById("q");
  let talks = [];
  let speakers = [];
  let people = {};  // speaker name -> GitHub username on people.dataverse.org

  // "@username", linked to the person's page on people.dataverse.org.
  function handle(name) {
    const user = people[name];
    if (!user) return "";
    const a = el("a", "handle", "@" + user);
    a.href = "https://people.dataverse.org/" + encodeURIComponent(user);
    a.title = `${name} on Dataverse People`;
    return a;
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  const speakerHref = name => "#/speaker/" + encodeURIComponent(name);

  function plural(n, word) {
    return `${n} ${word}${n === 1 ? "" : "s"}`;
  }

  // Which view the URL asks for: all talks, the speaker list, or one speaker's talks.
  function route() {
    const h = location.hash;
    if (h === "#/speakers") return { view: "speakers" };
    if (h.startsWith("#/speaker/")) {
      return { view: "talks", speaker: decodeURIComponent(h.slice("#/speaker/".length)) };
    }
    return { view: "talks" };
  }

  function matches(text) {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    return words.every(w => text.includes(w));
  }

  function renderTalks(speaker) {
    let pool = talks;
    filter.hidden = !speaker;
    if (speaker) {
      pool = talks.filter(t => t.speakers.includes(speaker));
      const all = el("a", "", "All talks");
      all.href = "#/";
      filter.replaceChildren(el("strong", "", speaker), handle(speaker), " · ", plural(pool.length, "talk"), " · ", all);
    }
    const shown = pool.filter(t => matches(t._text));
    count.textContent = `${shown.length} of ${plural(pool.length, "talk")}`;
    let year, ul;
    for (const t of shown) {
      if (t.date.slice(0, 4) !== year) {
        year = t.date.slice(0, 4);
        list.append(el("h2", "", year));
        ul = list.appendChild(el("ul"));
      }
      const li = el("li");
      li.append(el("span", "date", t.date));
      const body = el("div");
      const title = el(t.slides ? "a" : "span", "title", t.title);
      if (t.slides) title.href = t.slides;
      body.append(title);
      if (t.type && t.type !== "talk") body.append(el("span", "tag", t.type));
      const meta = el("div", "meta");
      t.speakers.forEach((s, i) => {
        if (i) meta.append(", ");
        const a = el("a", "", s);
        a.href = speakerHref(s);
        meta.append(a);
      });
      if (t.event) meta.append(t.speakers.length ? " · " : "", t.event);
      if (t.video) {
        const v = el("a", "", "📺 video");
        v.href = t.video;
        meta.append(meta.childNodes.length ? " · " : "", v);
      }
      body.append(meta);
      li.append(body);
      ul.append(li);
    }
  }

  function renderSpeakers() {
    filter.hidden = true;
    const shown = speakers.filter(s => matches(s.key));
    count.textContent = `${shown.length} of ${plural(speakers.length, "speaker")}`;
    const ul = list.appendChild(el("ul"));
    for (const s of shown) {
      const li = el("li", "speaker");
      const name = el("div", "who");
      const a = el("a", "title", s.name);
      a.href = speakerHref(s.name);
      name.append(a, handle(s.name));
      name.append(el("span", "years", s.first === s.last ? s.first : `${s.first}–${s.last}`));
      li.append(name, el("span", "n", plural(s.count, "talk")));
      ul.append(li);
    }
  }

  function render() {
    const r = route();
    document.getElementById("nav-talks").toggleAttribute("aria-current", r.view === "talks");
    document.getElementById("nav-speakers").toggleAttribute("aria-current", r.view === "speakers");
    q.placeholder = r.view === "speakers" ? "Search speakers…" : "Search titles, speakers, events…";
    list.replaceChildren();
    if (r.view === "speakers") renderSpeakers();
    else renderTalks(r.speaker);
  }

  // One entry per person: how many talks, and the first and last year they spoke.
  function buildSpeakers() {
    const by = new Map();
    for (const t of talks) {
      const year = t.date.slice(0, 4);
      for (const name of t.speakers) {
        const s = by.get(name) ||
          { name, key: (name + " " + (people[name] || "")).toLowerCase(), count: 0, first: year, last: year };
        s.count++;
        if (year < s.first) s.first = year;
        if (year > s.last) s.last = year;
        by.set(name, s);
      }
    }
    return [...by.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  }

  // people.json is optional: without it, names just aren't linked.
  const loadPeople = fetch("people.json")
    .then(r => (r.ok ? r.json() : {}))
    .catch(() => ({}))
    .then(p => { people = p; });

  Promise.all([fetch("talks.json").then(r => r.json()), loadPeople])
    .then(([data]) => {
      talks = data
        .map(t => ({ ...t, _text: [t.title, t.event, ...t.speakers].join(" ").toLowerCase() }))
        .sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title));
      speakers = buildSpeakers();
      render();
    })
    .catch(() => { count.textContent = "Couldn't load talks.json."; });
  q.addEventListener("input", render);
  window.addEventListener("hashchange", () => { q.value = ""; render(); window.scrollTo(0, 0); });
</script>
</body>
</html>
